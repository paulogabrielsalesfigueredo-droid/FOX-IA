<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoxIA - Crie Imagens e Vídeos com IA</title>
<style>
body{margin:0;font-family:Arial;background:#0f0f1a;color:white;text-align:center;padding:20px}
h1{font-size:32px}h1 span{color:#ff7a00}
.box{background:#1c1c2e;padding:20px;border-radius:20px;max-width:500px;margin:auto}
input,select{width:100%;padding:14px;border-radius:12px;border:none;margin:10px 0;font-size:16px}
button{background:#ff7a00;color:white;border:none;padding:15px;border-radius:12px;width:100%;font-size:18px;font-weight:bold;cursor:pointer}
button:active{opacity:.8}
img{width:100%;border-radius:15px;margin-top:15px;display:none}
p{opacity:.7}
</style>
</head>
<body>
<h1>🦊 Fox<span>IA</span></h1>
<p>A raposa que cria suas imagens com IA</p>
<div class="box">
<input id="prompt" placeholder="Ex: raposa laranja no espaço, desenho fofo">
<select id="estilo">
<option value="fofo, desenho animado">Estilo: Fofo</option>
<option value="realista, fotografia">Estilo: Realista</option>
<option value="anime">Estilo: Anime</option>
<option value="3d pixar">Estilo: 3D Pixar</option>
<option value="cyberpunk">Estilo: Cyberpunk</option>
</select>
<button onclick="gerar()">✨ GERAR IMAGEM</button>
<img id="resultado">
<p id="carregando"></p>
<button id="baixar" style="display:none;background:#25D366" onclick="baixar()">⬇ BAIXAR IMAGEM</button>
</div>
<p style="margin-top:20px">Vídeo em breve no FoxIA 🚀</p>
<script>
function gerar(){
let p=document.getElementById('prompt').value;
if(!p){alert('Escreva o que você quer criar!');return}
let e=document.getElementById('estilo').value;
let img=document.getElementById('resultado');
document.getElementById('carregando').innerText='🦊 FoxIA criando sua imagem...';
img.style.display='none';
let url='https://image.pollinations.ai/prompt/'+encodeURIComponent(p+', '+e)+'?seed='+Math.floor(Math.random()*99999)+'&width=1024&height=1024&nologo=true';
img.src=url;
img.onload=function(){document.getElementById('carregando').innerText='Prontinho! ✨';img.style.display='block';document.getElementById('baixar').style.display='block';}
}
function baixar(){
let img=document.getElementById('resultado');
let a=document.createElement('a');a.href=img.src;a.download='foxia.png';a.click();
}
</script>
</body>
</html>
